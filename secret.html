<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Secret — A Collection</title>
<style>
  :root{
    --bg-1:#0b0420;
    --bg-2:#2a0f3a;
    --accent:#b08bff;
    --muted:#efe6ff;
    --card-bg: rgba(255,255,255,0.02);
  }

  html,body{
    height:100%;
    margin:0;
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    font-family:"Courier New", monospace;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    box-sizing:border-box;
  }

  *, *::before, *::after {
    box-sizing:inherit;
  }

  .wrap{
    width:880px;
    max-width:94vw;
    background:var(--card-bg);
    border:3px solid rgba(176,139,255,0.08);
    padding:28px;
    border-radius:12px;
    box-shadow:0 30px 80px rgba(6,4,20,0.6);
    text-align:center;
  }

  h1{
    margin:0 0 12px 0;
    color:var(--accent);
    font-size:1.6rem;
  }

  p{
    color:rgba(239,230,255,0.95);
    line-height:1.6;
    margin:0 0 16px 0;
  }

  .actions{
    margin-top:24px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:10px 16px;
    border-radius:8px;
    background:linear-gradient(180deg,var(--accent),#7a4bff);
    color:#fff;
    text-decoration:none;
    font-weight:800;
    cursor:pointer;
    border:0;
    font-family:inherit;
    box-shadow:0 6px 0 rgba(0,0,0,0.2);
    transition:transform 0.1s ease, box-shadow 0.1s ease;
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 3px 0 rgba(0,0,0,0.2);
  }

  /* Responsive iframe wrapper */
  .gf-wrapper {
    width:100%;
    max-width:820px;
    margin:18px auto 0;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(6,4,20,0.45);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  }

  .gf-iframe {
    width:100%;
    height:720px;
    border:0;
    display:block;
  }

  /* Local form styling */
  .local-form {
    width:100%;
    max-width:820px;
    margin:18px auto 0;
    padding:20px;
    border-radius:10px;
    background:linear-gradient(180deg,#fff8ff,#fff3ff);
    color:#2b0f3a;
    box-shadow:0 18px 40px rgba(6,4,20,0.12);
    text-align:left;
  }

  .local-form label{
    display:block;
    font-weight:700;
    margin:10px 0 6px 0;
    color:#2b0f3a;
  }

  .local-form input[type="text"], .local-form textarea{
    width:100%;
    padding:10px 12px;
    border-radius:6px;
    border:2px solid rgba(138,91,255,0.2);
    background:#ffffff;
    color:#2b0f3a;
    font-family:inherit;
    font-size:0.95rem;
    outline:none;
  }

  .local-form input[type="text"]:focus, .local-form textarea:focus{
    border-color:var(--accent);
  }

  .local-form textarea{
    min-height:140px;
    resize:vertical;
  }

  .local-form .row{
    display:flex;
    gap:12px;
    align-items:center;
    margin-top:14px;
    flex-wrap:wrap;
  }

  .local-form .submit{
    display:inline-flex;
    padding:10px 16px;
    border-radius:6px;
    background:linear-gradient(180deg,var(--accent),#7a4bff);
    color:#fff;
    font-weight:800;
    text-decoration:none;
    border:0;
    cursor:pointer;
    font-family:inherit;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }

  .local-form .submit:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }

  @media (max-width:600px){ 
    .gf-iframe{height:850px} 
    .wrap{padding:18px} 
    h1{font-size:1.3rem} 
  }
</style>
</head>
<body>
  <div class="wrap" role="main">
    <h1>Secret Page</h1>
    <p>This is a quiet place for the collection — a small secret tucked away. Use the form below to send a private note that will be collected in your Google Form responses.</p>

    <div class="gf-wrapper" aria-label="Google Form embed">
      <iframe
        class="gf-iframe"
        src="https://docs.google.com/forms/d/e/1FAIpQLSeSS1fm39R2nrjM-yolYwtPkUpkFPJdEESGGET7BZrEq9YFGg/viewform?embedded=true" 
        title="Secret Google Form"
        loading="lazy">
      </iframe>
    </div>

    <div class="local-form">
      <form id="gfFallback" method="POST" target="_blank" action="https://docs.google.com/forms/d/e/1FAIpQLSeSS1fm39R2nrjM-yolYwtPkUpkFPJdEESGGET7BZrEq9YFGg/formResponse">
        <label for="entry title">Entry Title</label>
        <input id="entry title" name="entry.1568720167" type="text" placeholder="Short title" required>

        <label for="entry write">Write Here</label>
        <textarea id="entry write" name="entry.1886654566" placeholder="Write your message..." required></textarea>

        <div class="row">
          <button type="submit" class="submit">Submit</button>
          <small style="color:#6b5bb0">Opens in a new tab</small>
        </div>
      </form>
    </div>

    <div class="actions">
      <a class="btn" href="index.html">Return</a>
      <a class="btn" id="openFormLink" href="#" target="_blank" rel="noopener">Open Form in new tab</a>
    </div>
  </div>

<script>
  (function(){
    const iframe = document.querySelector('.gf-iframe');
    const openLink = document.getElementById('openFormLink');

    try {
      const src = iframe && iframe.getAttribute('src') || '';
      if(src && src.includes('docs.google.com/forms') && !src.includes('YOUR_FORM_ID')){
        const full = src.replace('?embedded=true','');
        openLink.href = full;
      } else {
        openLink.href = '#';
        openLink.addEventListener('click', (e) => {
          if(openLink.getAttribute('href') === '#') {
            e.preventDefault();
            alert('Please replace YOUR_FORM_ID in the iframe src with your actual Google Form ID.');
          }
        });
      }
    } catch (err) {
      openLink.href = '#';
    }

    const fallback = document.getElementById('gfFallback');
    fallback.addEventListener('submit', (e) => {
      const action = fallback.getAttribute('action');
      const titleInput = document.getElementById('entry title');
      if(action.includes('FORM_ID') || titleInput.name === 'entry.1568720167'){
        e.preventDefault();
        alert('Please replace FORM_ID and ENTRY_* placeholders in secret.html with your Google Form entry IDs before submitting.');
      }
    });
  })();
</script>
</body>
</html>
